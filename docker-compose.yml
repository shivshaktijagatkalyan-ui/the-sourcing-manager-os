version: '3.8'

services:
  # Reverse proxy - routes traffic to services
  reverse-proxy:
    image: dhi.io/nginx:1-alpine3.21
    container_name: sourcing-manager-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - sm-network
    depends_on:
      - web-dashboard
      - flutter-app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    
    # Security: drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Web Dashboard - Next.js application
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: sourcing-manager-web
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NODE_ENV=production
      - LOG_LEVEL=info
    expose:
      - "3000"
    volumes:
      - web-logs:/app/.next/cache
    networks:
      - sm-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    
    # Security: drop unnecessary capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Flutter App - nginx serving compiled web app
  flutter-app:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    container_name: sourcing-manager-flutter
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    expose:
      - "80"
    volumes:
      - flutter-logs:/var/log/nginx
    networks:
      - sm-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    
    # Security: drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# Named volumes for data persistence
volumes:
  web-logs:
    driver: local
  flutter-logs:
    driver: local

# Shared network for service communication
networks:
  sm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
