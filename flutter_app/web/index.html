<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sourcing_manager_os">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sourcing_manager_os</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #fff;
      font-family: ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flutter-loading {
      text-align: center;
      line-height: 1.5;
      padding: 24px;
    }

    #flutter-loading .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    #flutter-loading .subtitle {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="flutter-loading">
    <div class="title">Loading Sourcing Manager OS…</div>
    <div class="subtitle">If this screen stays white, check the browser console for errors.</div>
  </div>

  <script>
    window.addEventListener('error', function (event) {
      document.body.innerHTML = '<div style="padding:24px;color:#fff;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;"><div><div style="font-size:18px;font-weight:700;margin-bottom:8px;">Application failed to start</div><div style="font-size:14px;opacity:.9;">Open DevTools console for details.</div></div></div>';
    });

    // Unregister all service workers to prevent stale PWA caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister().then(function(success) {
            if (success) {
              console.log('Successfully unregistered stale service worker.');
            }
          });
        }
      });
    }

    // Custom Flutter initialization observer
    (function() {
      var interval = setInterval(function() {
        if (document.querySelector('flutter-view')) {
          var loader = document.getElementById('flutter-loading');
          if (loader) loader.remove();
          clearInterval(interval);
        }
      }, 100);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
