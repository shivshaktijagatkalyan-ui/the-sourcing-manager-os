name: Dependency Vulnerability Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Run npm audit scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run root npm audit
        run: |
          npm audit --audit-level=high

      - name: Run web-dashboard npm audit
        run: |
          cd web-dashboard
          npm audit --audit-level=high
